[project]
name = "kagura-memory"
dynamic = ["version"]
description = "Python SDK for Kagura Memory Cloud — AI-driven memory management"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Fumikazu Kiyota", email = "fumikazu.kiyota@gmail.com"}
]
keywords = ["ai", "memory", "mcp", "agent", "llm", "kagura"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "litellm>=1.50,<1.82.7",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
]

[project.scripts]
kagura = "kagura_memory.cli:main"

[project.urls]
Homepage = "https://github.com/kagura-ai/kagura-memory-python-sdk"
Repository = "https://github.com/kagura-ai/kagura-memory-python-sdk"
Issues = "https://github.com/kagura-ai/kagura-memory-python-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/kagura_memory/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kagura_memory"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "integration: requires a live memory-cloud backend (gated by KAGURA_INTEGRATION_URL env var)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
