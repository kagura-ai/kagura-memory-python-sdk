[project]
name = "kagura-memory"
dynamic = ["version"]
description = "Python SDK for Kagura Memory Cloud — memory management, document ingestion (PDF → memory graph), and R2 file storage for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Fumikazu Kiyota", email = "fumikazu.kiyota@gmail.com"}
]
keywords = [
    "ai",
    "memory",
    "mcp",
    "agent",
    "llm",
    "kagura",
    "pdf",
    "document-ingestion",
    "rag",
    "embeddings",
    "vector-search",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "litellm>=1.50,<1.82.7",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
]
# File ingestion (Issue #80) — heavy parsing dependencies are opt-in.
# `httpx` is intentionally NOT listed here: it's already a core dependency
# (see top of [dependencies]) and listing it again would shadow the core pin.
ingest = [
    "pillow>=10.4",
]
ingest-pdf = [
    "kagura-memory[ingest]",
    "pymupdf>=1.24",
]
ingest-html = [
    "kagura-memory[ingest]",
    "beautifulsoup4>=4.12",
]
ingest-docx = [
    "kagura-memory[ingest]",
    "python-docx>=1.1",
]
ingest-xlsx = [
    "kagura-memory[ingest]",
    "openpyxl>=3.1",
]
ingest-pptx = [
    "kagura-memory[ingest]",
    "python-pptx>=0.6.23",
]
# EPUB reuses PyMuPDF (no new dependency) — alias of the PDF extra.
ingest-epub = [
    "kagura-memory[ingest-pdf]",
]
# YouTube transcript ingestion (Issue #146) — captions-only, no API key.
# `youtube-transcript-api` v1.0+ uses an instance-based API; oEmbed (title /
# channel) goes through the core `httpx` dependency, so no extra dep there.
ingest-youtube = [
    "kagura-memory[ingest]",
    "youtube-transcript-api>=1.0",
]
# Plain text / Markdown need no extra (stdlib) — covered by base [ingest].
ingest-all = [
    "kagura-memory[ingest-pdf]",
    "kagura-memory[ingest-html]",
    "kagura-memory[ingest-docx]",
    "kagura-memory[ingest-xlsx]",
    "kagura-memory[ingest-pptx]",
    "kagura-memory[ingest-epub]",
    "kagura-memory[ingest-youtube]",
]

[project.scripts]
kagura = "kagura_memory.cli:main"

[project.urls]
Homepage = "https://github.com/kagura-ai/kagura-memory-python-sdk"
Repository = "https://github.com/kagura-ai/kagura-memory-python-sdk"
Issues = "https://github.com/kagura-ai/kagura-memory-python-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/kagura_memory/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kagura_memory"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "integration: requires a live memory-cloud backend (gated by KAGURA_INTEGRATION_URL, KAGURA_API_KEY, and KAGURA_INTEGRATION_CONTEXT_ID env vars)",
    "eval: ingestion quality eval against real LLMs (gated by ANTHROPIC_API_KEY / GEMINI_API_KEY env vars; default-skipped, run with `pytest -m eval`)",
    "youtube: requires network access to YouTube; default-skipped, run with `pytest -m youtube`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
